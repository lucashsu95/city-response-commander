name: Deploy Temp Frontend to GitHub Pages

on:
  push:
    branches:
      - temp/restore-cdk-deployment-source
    paths:
      - "packages/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-temp-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: city-commander-temp-frontend-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Verify deployment commit
        shell: bash
        run: |
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared schemas
        run: npm run build --workspace packages/shared-schemas

      - name: Build frontend
        working-directory: packages/frontend
        env:
          VITE_API_ENDPOINT: https://du6wcg8xe4.execute-api.us-west-2.amazonaws.com
          VITE_API_MODE: demo
          VITE_APP_ENV: DEMO
          VITE_WS_ENDPOINT: ""
          BASE_URL: /city-response-commander/
        run: npm run build

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## City Commander frontend deployment"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Page URL: \`${PAGE_URL:-unavailable}\`"
            echo "- Public URL: https://lucashsu95.github.io/city-response-commander/"
            echo "- Backend CI/CD: untouched (independent workflow)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}