name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CITY_COMMANDER_ENV: LOCAL_MOCK

jobs:
  deterministic-tests:
    name: Deterministic Suite (LOCAL_MOCK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate custom ESLint boundary rule
        run: npm run test:lint-rule

      - name: Validate shell scripts
        run: bash -n scripts/check-no-credentials.sh scripts/local_mock_rehearsal.sh scripts/verify_sources.sh && sh -n .githooks/pre-commit

      - name: Validate LOCAL_MOCK rehearsal plan
        run: npm run rehearsal:dry-run

      - name: Validate source hash STOP gate
        run: npm run test:source-gate

      - name: Run deterministic tests
        run: npm test

      - name: Check language boundary
        run: npm run check:language-boundary

      - name: Scan for accidentally committed secrets
        run: npm run check:no-credentials
